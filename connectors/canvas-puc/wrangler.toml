# Remote Canvas connector on Cloudflare Workers (ADR 0010).
# Deploy: `npm run worker:deploy` (needs CLOUDFLARE_API_TOKEN). The seal key is a secret:
#   npx wrangler secret put SEAL_KEY --config connectors/canvas-puc/wrangler.toml
# Without PUBLIC_URL, the OAuth issuer is the Worker's own address (https://canvas-puc-remote.<account>.workers.dev).
name = "canvas-puc-remote"
main = "src/worker.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[vars]
CANVAS_BASE_URL = "https://pucminas.instructure.com"
CANVAS_ALLOW_WRITE = "true"

# Write opt-ins made after sign-in on /write-access: key `write:<SHA-256 of the Canvas token>` → "on".
# Never the token itself. Replace the id with the one from `npx wrangler kv namespace create CANVAS_KV`.
[[kv_namespaces]]
binding = "CANVAS_KV"
id = "ba47d2a0f5374b17a66c8fdb36ad7460"

[observability]
enabled = true
