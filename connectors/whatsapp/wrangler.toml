# Personal WhatsApp connector on Cloudflare Workers + Containers (ADR 0015). Self-host template: each person deploys
# it to their own account and pairs their own number. Full guide: connectors/whatsapp/README.md.
#
# Secrets (wrangler secret put <NAME> --config connectors/whatsapp/wrangler.toml):
#   SEAL_KEY             32 bytes in base64 (OAuth and /pair session seals)
#   BRIDGE_TOKEN         32+ random characters (Worker ↔ bridge in the container)
#   SNAPSHOT_KEY         32 bytes in base64 (AES-256-GCM for the R2 backups)
#   GITHUB_CLIENT_ID     GitHub OAuth App client ID
#   GITHUB_CLIENT_SECRET GitHub OAuth App secret
#   ALLOWED_EMAILS       the owner's verified GitHub email(s)
name = "whatsapp-remote"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[vars]
TIMEZONE = "America/Sao_Paulo"
# Idle time before the container sleeps (30s to 1h).
SLEEP_AFTER = "5m"
TOOL_TIMEOUT_MS = "25000"
SYNC_WAIT_MS = "8000"
HISTORY_DAYS = "90"
MAX_MEDIA_BYTES = "5242880"
# Sending enabled: send_message sends one message at a time, always with the owner's explicit confirmation and the
# SEND_MAX_PER_HOUR limit. Empty SEND_ALLOWLIST = any contact or group; to restrict it, comma-separated numbers
# (country code + number) or JIDs. To turn sending off, ENABLE_SEND = "false".
ENABLE_SEND = "true"
SEND_ALLOWLIST = ""
SEND_MAX_PER_HOUR = "10"
# Optional periodic sync: empty = off. To turn it on, put the SAME expression here and in [triggers].crons.
SYNC_CRON = ""

# No Cron Trigger by default: nothing wakes the container without a call from you.
[triggers]
crons = []

[[containers]]
class_name = "WhatsAppBridge"
image = "./Dockerfile"
# Smallest instance: 1/16 vCPU, 256 MiB, 2 GB (measured in ADR 0015).
instance_type = "lite"
# A single instance: two bridges never run the same WhatsApp session.
max_instances = 1

[[durable_objects.bindings]]
name = "WHATSAPP_BRIDGE"
class_name = "WhatsAppBridge"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["WhatsAppBridge"]

[[r2_buckets]]
binding = "SNAPSHOTS"
bucket_name = "whatsapp-snapshots"

[observability]
enabled = true
