# Remote multi-account Gmail connector on Cloudflare Workers (ADR 0014, ADR 0019).
# On demand: no Containers, Cron Triggers, Durable Object alarms or polling. State lives only in Workers KV.
# Step-by-step deploy and secrets in connectors/gmail/README.md.
name = "gmail-remote"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# Claude's OAuth tokens, clients and grants (managed by @cloudflare/workers-oauth-provider).
# Replace the id with the one from `npx wrangler kv namespace create OAUTH_KV`.
[[kv_namespaces]]
binding = "OAUTH_KV"
id = "1339a43dd026408b8f75dd88100ddd74"

# Gmail accounts linked per user (refresh tokens sealed with AES-256-GCM), link requests and tickets.
# Replace the id with the one from `npx wrangler kv namespace create GMAIL_KV`.
[[kv_namespaces]]
binding = "GMAIL_KV"
id = "63a15f1df7854a279ed4aec4215d454b"

# Simple per-OAuth-session limit on /mcp: 120 requests per minute.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "2401"

  [ratelimits.simple]
  limit = 120
  period = 60

# Per-IP limit on routes without a token (registration, sign-in, linking, /token): 30 requests per minute.
# Blocks abuse from people without an account, at no KV cost (the connector is public).
[[ratelimits]]
name = "RATE_LIMITER_PUBLIC"
namespace_id = "2402"

  [ratelimits.simple]
  limit = 30
  period = 60

# PUBLIC_URL (optional): the Worker's canonical URL. Without it, the request origin (*.workers.dev) is used.
# [vars]
# PUBLIC_URL = "https://gmail-remote.<your-account>.workers.dev"

[observability]
enabled = true
