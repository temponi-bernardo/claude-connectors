# Conector Gmail remoto (multi-conta, só leitura) no Cloudflare Workers (ADR 0014).
# Sob demanda: sem Containers, Cron Triggers, alarms de Durable Object ou polling. Estado só no Workers KV.
# Passo a passo do deploy e dos secrets em connectors/gmail/README.md.
name = "gmail-remote"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# Tokens, clientes e grants OAuth do Claude (gerenciados por @cloudflare/workers-oauth-provider).
# Troque o id pelo de `npx wrangler kv namespace create OAUTH_KV`.
[[kv_namespaces]]
binding = "OAUTH_KV"
id = "1339a43dd026408b8f75dd88100ddd74"

# Contas Gmail vinculadas por usuário (refresh tokens selados com AES-256-GCM), pedidos e tickets de vínculo.
# Troque o id pelo de `npx wrangler kv namespace create GMAIL_KV`.
[[kv_namespaces]]
binding = "GMAIL_KV"
id = "63a15f1df7854a279ed4aec4215d454b"

# Limite simples por sessão OAuth no /mcp: 120 requisições por minuto.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "2401"

  [ratelimits.simple]
  limit = 120
  period = 60

# Limite por IP nas rotas sem token (registro, login, vínculo, /token): 30 requisições por minuto.
# Barra abuso de quem não tem conta, sem custo de KV (o conector é público).
[[ratelimits]]
name = "RATE_LIMITER_PUBLIC"
namespace_id = "2402"

  [ratelimits.simple]
  limit = 30
  period = 60

# PUBLIC_URL (opcional): URL canônica do Worker. Sem ela, vale a origem da requisição (*.workers.dev).
# [vars]
# PUBLIC_URL = "https://gmail-remote.<sua-conta>.workers.dev"

[observability]
enabled = true
