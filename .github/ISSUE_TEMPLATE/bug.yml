name: Bug
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: behavior
    attributes:
      label: What happens
      description: Include the full error message, if any.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should happen
      description: Cite the process (P01...) or the function in docs/ if you know it.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: How to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: v0.1.0 or commit hash
