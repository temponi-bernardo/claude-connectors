name: release-please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # Segredos futuros (descomente e crie em Settings → Secrets quando precisar):
          # token: ${{ secrets.RELEASE_PLEASE_TOKEN }}  # PAT para que o PR de release dispare o CI
          # NPM_TOKEN para publicar pacote; APPLE_ID / APP_STORE_KEY para notarizar binários; etc.
