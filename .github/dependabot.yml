version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: America/Sao_Paulo
    groups:
      dev-dependencies:
        dependency-type: development
      production-dependencies:
        dependency-type: production
    commit-message:
      prefix: 'chore(deps)'
    open-pull-requests-limit: 5
    ignore:
      # zod 4 muda a API dos esquemas das ferramentas: migração é tarefa própria (ROADMAP F2.4)
      - dependency-name: zod
        update-types: ['version-update:semver-major']
