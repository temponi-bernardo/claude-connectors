# Blueprint do Render para o conector Canvas remoto (ADR 0009).
# Render → New → Blueprint → este repositório. A URL pública vem de RENDER_EXTERNAL_URL e a SEAL_KEY é
# gerada pelo Render. Passo a passo em connectors/canvas-puc/README.md ("Conector remoto").
services:
  - type: web
    name: canvas-puc-remote
    runtime: docker
    plan: free
    dockerfilePath: ./connectors/canvas-puc/Dockerfile
    dockerContext: ./connectors/canvas-puc
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: SEAL_KEY
        generateValue: true
      - key: CANVAS_BASE_URL
        value: https://pucminas.instructure.com
      - key: CANVAS_ALLOW_WRITE
        value: 'true'
